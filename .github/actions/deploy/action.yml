name: Deploy via SSH
description: Deploy the application to a remote server via SSH using Docker Compose

inputs:
  deploy-host:
    description: SSH host
    required: true
  deploy-port:
    description: SSH port
    required: true
  deploy-user:
    description: SSH username
    required: true
  deploy-ssh-key:
    description: SSH private key
    required: true
  ghcr-username:
    description: GHCR username for docker login
    required: true
  ghcr-pat:
    description: GHCR personal access token
    required: true
  docker-image:
    description: "Full Docker image tag (e.g. ghcr.io/count-collab/count-collab:latest)"
    required: true
  deploy-dir:
    description: "Remote deployment directory path (e.g. $HOME/count-collab)"
    required: true
  container-name:
    description: "Base container name (e.g. count-collab)"
    required: true
  app-port:
    description: "Port mapping (e.g. 80:3000)"
    required: true
  compose-filename:
    description: Name of the generated compose file
    required: true
    default: compose.yaml
  postgres-user:
    description: PostgreSQL username
    required: true
  postgres-password:
    description: PostgreSQL password
    required: true
  postgres-db:
    description: PostgreSQL database name
    required: true
  auth-secret:
    description: Auth.js secret key
    required: true
  auth-google-id:
    description: Google OAuth client ID
    required: true
  auth-google-secret:
    description: Google OAuth client secret
    required: true
  auth-discord-id:
    description: Discord OAuth client ID
    required: true
  auth-discord-secret:
    description: Discord OAuth client secret
    required: true
  auth-twitch-id:
    description: Twitch OAuth client ID
    required: true
  auth-twitch-secret:
    description: Twitch OAuth client secret
    required: true
  volume-name:
    description: "Name of the Docker volume for PostgreSQL data (e.g. postgres_data)"
    required: true
    default: postgres_data
  noindex:
    description: "Set to 'true' to prevent search engine indexing (dev environments)"
    required: false
    default: "false"
  domain:
    description: "Domain name for Traefik routing (e.g. count-collab.cc)"
    required: true
  posthog-key:
    description: PostHog public API key
    required: false
    default: ""
  posthog-host:
    description: PostHog host URL
    required: false
    default: ""
  origin:
    description: "Public origin for ORIGIN (CSRF check, HTTPS detection). Defaults to https://<domain>"
    required: false
    default: ""
  address-header:
    description: "Header carrying the client IP for ADDRESS_HEADER (rate limiting). Traefik sets X-Forwarded-For; clear it if the app is exposed without a proxy"
    required: false
    default: "X-Forwarded-For"
  xff-depth:
    description: "Trusted proxies in front of the app for XFF_DEPTH (1 = Traefik only; use 2 when Cloudflare is also in front and trusted by Traefik)"
    required: false
    default: "1"

runs:
  using: composite

  steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
      env:
        IN_DEPLOY_DIR: ${{ inputs.deploy-dir }}
        IN_GHCR_USERNAME: ${{ inputs.ghcr-username }}
        IN_GHCR_PAT: ${{ inputs.ghcr-pat }}
        IN_DOCKER_IMAGE: ${{ inputs.docker-image }}
        IN_CONTAINER_NAME: ${{ inputs.container-name }}
        IN_COMPOSE_FILENAME: ${{ inputs.compose-filename }}
        IN_VOLUME_NAME: ${{ inputs.volume-name }}
        IN_DOMAIN: ${{ inputs.domain }}
        IN_NOINDEX: ${{ inputs.noindex }}
        IN_POSTGRES_USER: ${{ inputs.postgres-user }}
        IN_POSTGRES_PASSWORD: ${{ inputs.postgres-password }}
        IN_POSTGRES_DB: ${{ inputs.postgres-db }}
        IN_AUTH_SECRET: ${{ inputs.auth-secret }}
        IN_AUTH_GOOGLE_ID: ${{ inputs.auth-google-id }}
        IN_AUTH_GOOGLE_SECRET: ${{ inputs.auth-google-secret }}
        IN_AUTH_DISCORD_ID: ${{ inputs.auth-discord-id }}
        IN_AUTH_DISCORD_SECRET: ${{ inputs.auth-discord-secret }}
        IN_AUTH_TWITCH_ID: ${{ inputs.auth-twitch-id }}
        IN_AUTH_TWITCH_SECRET: ${{ inputs.auth-twitch-secret }}
        IN_POSTHOG_KEY: ${{ inputs.posthog-key }}
        IN_POSTHOG_HOST: ${{ inputs.posthog-host }}
        IN_ORIGIN: ${{ inputs.origin }}
        IN_ADDRESS_HEADER: ${{ inputs.address-header }}
        IN_XFF_DEPTH: ${{ inputs.xff-depth }}
      with:
        host: ${{ inputs.deploy-host }}
        port: ${{ inputs.deploy-port }}
        username: ${{ inputs.deploy-user }}
        key: ${{ inputs.deploy-ssh-key }}
        envs: IN_DEPLOY_DIR,IN_GHCR_USERNAME,IN_GHCR_PAT,IN_DOCKER_IMAGE,IN_CONTAINER_NAME,IN_COMPOSE_FILENAME,IN_VOLUME_NAME,IN_DOMAIN,IN_NOINDEX,IN_POSTGRES_USER,IN_POSTGRES_PASSWORD,IN_POSTGRES_DB,IN_AUTH_SECRET,IN_AUTH_GOOGLE_ID,IN_AUTH_GOOGLE_SECRET,IN_AUTH_DISCORD_ID,IN_AUTH_DISCORD_SECRET,IN_AUTH_TWITCH_ID,IN_AUTH_TWITCH_SECRET,IN_POSTHOG_KEY,IN_POSTHOG_HOST,IN_ORIGIN,IN_ADDRESS_HEADER,IN_XFF_DEPTH
        script: |
          set -e

          # Function to URL-encode credentials (value passed as argv, never interpolated into code)
          urlencode() {
            python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$1"
          }

          # Callers pass a literal leading $HOME (e.g. $HOME/count-collab); expand it here without eval
          case "$IN_DEPLOY_DIR" in
            '$HOME'|'$HOME'/*) DEPLOY_DIR="$HOME${IN_DEPLOY_DIR#\$HOME}" ;;
            *) DEPLOY_DIR="$IN_DEPLOY_DIR" ;;
          esac
          mkdir -p "$DEPLOY_DIR"

          # Login to GHCR and pull latest image
          printf '%s' "$IN_GHCR_PAT" | docker login ghcr.io -u "$IN_GHCR_USERNAME" --password-stdin

          # Save previous image digest for rollback
          PREVIOUS_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IN_DOCKER_IMAGE" 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_DIGEST" ]; then
            docker tag "$IN_DOCKER_IMAGE" "$IN_DOCKER_IMAGE-rollback"
            echo "Saved previous image as $IN_DOCKER_IMAGE-rollback (digest: $PREVIOUS_DIGEST)"
          else
            echo "No previous image found, rollback will not be available"
          fi

          docker pull "$IN_DOCKER_IMAGE"

          # Generate .env file with URL-encoded credentials
          ENCODED_USER=$(urlencode "$IN_POSTGRES_USER")
          ENCODED_PASSWORD=$(urlencode "$IN_POSTGRES_PASSWORD")
          cat > "$DEPLOY_DIR/.env" <<EOF
          DATABASE_URL=postgresql://${ENCODED_USER}:${ENCODED_PASSWORD}@db:5432/${IN_POSTGRES_DB}
          NODE_ENV=production
          NOINDEX=${IN_NOINDEX}
          AUTH_SECRET=${IN_AUTH_SECRET}
          AUTH_GOOGLE_ID=${IN_AUTH_GOOGLE_ID}
          AUTH_GOOGLE_SECRET=${IN_AUTH_GOOGLE_SECRET}
          AUTH_DISCORD_ID=${IN_AUTH_DISCORD_ID}
          AUTH_DISCORD_SECRET=${IN_AUTH_DISCORD_SECRET}
          AUTH_TWITCH_ID=${IN_AUTH_TWITCH_ID}
          AUTH_TWITCH_SECRET=${IN_AUTH_TWITCH_SECRET}
          PUBLIC_POSTHOG_KEY=${IN_POSTHOG_KEY}
          PUBLIC_POSTHOG_HOST=${IN_POSTHOG_HOST}
          ORIGIN=${IN_ORIGIN:-https://${IN_DOMAIN}}
          EOF

          # Client IP for rate limiting comes from the proxy header; without it every user shares one bucket
          if [ -n "$IN_ADDRESS_HEADER" ]; then
            printf 'ADDRESS_HEADER=%s\nXFF_DEPTH=%s\n' "$IN_ADDRESS_HEADER" "${IN_XFF_DEPTH:-1}" >> "$DEPLOY_DIR/.env"
          fi

          # Generate compose file
          cat > "$DEPLOY_DIR/$IN_COMPOSE_FILENAME" <<EOF
          services:
            migrations:
              image: ${IN_DOCKER_IMAGE}
              container_name: ${IN_CONTAINER_NAME}-migrations
              env_file:
                - .env
              depends_on:
                db:
                  condition: service_healthy
              networks:
                - ${IN_CONTAINER_NAME}
              command: bun run db:migrate
              profiles:
                - ""

            count-collab:
              image: ${IN_DOCKER_IMAGE}
              container_name: ${IN_CONTAINER_NAME}
              restart: unless-stopped
              env_file:
                - .env
              depends_on:
                migrations:
                  condition: service_completed_successfully
              healthcheck:
                test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://0.0.0.0:3000/health || exit 1"]
                interval: 2s
                timeout: 5s
                retries: 5
                start_period: 5s
              labels:
                - "traefik.enable=true"
                - "traefik.http.routers.${IN_CONTAINER_NAME}.rule=Host(\`${IN_DOMAIN}\`)"
                - "traefik.http.routers.${IN_CONTAINER_NAME}.entrypoints=websecure"
                - "traefik.http.routers.${IN_CONTAINER_NAME}.tls=true"
                - "traefik.http.services.${IN_CONTAINER_NAME}.loadbalancer.server.port=3000"
              networks:
                - ${IN_CONTAINER_NAME}
                - web

            db:
              image: postgres:16-alpine
              container_name: ${IN_CONTAINER_NAME}-db
              restart: unless-stopped
              environment:
                POSTGRES_USER: ${IN_POSTGRES_USER}
                POSTGRES_PASSWORD: ${IN_POSTGRES_PASSWORD}
                POSTGRES_DB: ${IN_POSTGRES_DB}
              volumes:
                - ${IN_VOLUME_NAME}:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U ${IN_POSTGRES_USER} -d ${IN_POSTGRES_DB}"]
                interval: 10s
                timeout: 5s
                retries: 5
              networks:
                - ${IN_CONTAINER_NAME}

          volumes:
            ${IN_VOLUME_NAME}:
              driver: local

          networks:
            ${IN_CONTAINER_NAME}:
              driver: bridge
            web:
              external: true
          EOF

          cd "$DEPLOY_DIR"

          # Check if database container is already running
          if docker ps --format '{{.Names}}' | grep -qxF "${IN_CONTAINER_NAME}-db"; then
            echo "Database already running, running migrations and restarting app..."
            docker compose run --rm migrations
            docker compose up -d count-collab
          else
            echo "Starting full stack (database + migrations + app)..."
            docker compose up -d
          fi

          # Wait for count-collab to become healthy
          echo "Waiting for count-collab to become healthy..."
          HEALTH_TIMEOUT=90
          POLL_INTERVAL=5
          ELAPSED=0

          set +e
          while [ $ELAPSED -lt $HEALTH_TIMEOUT ]; do
            HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$IN_CONTAINER_NAME" 2>/dev/null)

            echo $HEALTH_STATUS

            if [ "$HEALTH_STATUS" = "healthy" ]; then
              echo "count-collab is healthy after ${ELAPSED}s"
              docker compose ps
              exit 0
            fi
            if [ "$HEALTH_STATUS" = "unhealthy" ]; then
              echo "count-collab reported unhealthy after ${ELAPSED}s"
              break
            fi
            echo "Health status: ${HEALTH_STATUS:-unknown} (${ELAPSED}s/${HEALTH_TIMEOUT}s)"
            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done
          set -e

          # Health check failed — show logs and attempt rollback
          echo "ERROR: count-collab failed to become healthy after ${ELAPSED}s (timeout: ${HEALTH_TIMEOUT}s)"
          echo "=== Container logs ==="
          docker compose logs count-collab --tail 50
          echo "======================"

          if docker image inspect "$IN_DOCKER_IMAGE-rollback" >/dev/null 2>&1; then
            echo "Rolling back to previous image (migrations are always backward-compatible)..."
            docker tag "$IN_DOCKER_IMAGE-rollback" "$IN_DOCKER_IMAGE"
            docker compose up -d count-collab
            echo "Rollback complete — restarted with previous image"
          else
            echo "No rollback image available, cannot restore previous version"
          fi

          exit 1
