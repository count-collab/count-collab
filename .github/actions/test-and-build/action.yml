name: Test and Build
description: Run tests, linting, Svelte checks, and build the application

inputs:
  PUBLIC_POSTHOG_PROJECT_TOKEN:
    description: PostHog project API token
    required: true
  PUBLIC_POSTHOG_HOST:
    description: PostHog host URL
    required: true

runs:
  using: composite

  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash

    - name: Write .env for type generation
      run: |
        echo "PUBLIC_POSTHOG_PROJECT_TOKEN=${{ inputs.PUBLIC_POSTHOG_PROJECT_TOKEN }}" >> .env
        echo "PUBLIC_POSTHOG_HOST=${{ inputs.PUBLIC_POSTHOG_HOST }}" >> .env
      shell: bash

    - name: Prepare Svelte
      run: bunx svelte-kit sync
      shell: bash

    - name: Lint
      run: bun run lint
      shell: bash

    - name: Test
      run: bun run test
      shell: bash

    - name: Check Svelte
      run: bun run svelte-check
      shell: bash

    - name: Build
      run: bun run build
      shell: bash
      env:
        DATABASE_URL: postgresql://user:password@localhost:5432/count_collab
