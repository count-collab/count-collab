name: E2E Tests
description: Build the application and run Playwright end-to-end tests

inputs:
  database-url:
    description: PostgreSQL connection string for the test database
    required: true
  auth-secret:
    description: Auth.js secret key
    required: true

runs:
  using: composite

  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash

    - name: Build application
      run: bun run build
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database-url }}

    - name: Wait for Postgres
      run: |
        for i in $(seq 1 30); do
          if pg_isready -h localhost -p 5433 2>/dev/null || nc -z localhost 5433 2>/dev/null; then
            echo "Postgres is ready"
            exit 0
          fi
          echo "Waiting for Postgres... ($i/30)"
          sleep 1
        done
        echo "Postgres failed to start"
        exit 1
      shell: bash

    - name: Push database schema
      run: bunx drizzle-kit push:pg
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database-url }}

    - name: Install Playwright browsers
      run: bunx playwright install chromium --with-deps
      shell: bash

    - name: Run E2E tests
      run: bun run test:e2e
      shell: bash
      env:
        CI: "true"
        DATABASE_URL: ${{ inputs.database-url }}
        AUTH_SECRET: ${{ inputs.auth-secret }}
