name: E2E Tests
description: Build the application and run Playwright end-to-end tests against a self-managed Postgres container

runs:
  using: composite

  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1

    - name: Start Postgres via docker-compose
      id: postgres
      run: docker compose -f docker-compose.e2e.yml up -d
      shell: bash

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash

    - name: Build application
      run: bun run build
      shell: bash
      env:
        DATABASE_URL: postgresql://user:password@localhost:5433/count_collab

    - name: Push database schema
      run: bunx drizzle-kit push:pg --config drizzle.config.ts
      shell: bash
      env:
        DATABASE_URL: postgresql://user:password@localhost:5433/count_collab

    - name: Install Playwright browsers
      run: bunx playwright install chromium --with-deps
      shell: bash

    - name: Run E2E tests
      run: bun run test:e2e
      shell: bash
      env:
        CI: "true"
        DATABASE_URL: postgresql://user:password@localhost:5433/count_collab
        AUTH_SECRET: ci-test-secret

    - name: Stop Postgres
      if: always()
      run: docker rm -f e2e-postgres 2>/dev/null || true
      shell: bash
