name: E2E Tests
description: Build the application and run Playwright end-to-end tests against a self-managed Postgres container

runs:
  using: composite

  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1

    - name: Start Postgres
      id: postgres
      run: |
        # Clean up any leftover container from a previous run
        docker rm -f e2e-postgres 2>/dev/null || true

        docker run -d \
          --name e2e-postgres \
          -e POSTGRES_USER=test \
          -e POSTGRES_PASSWORD=test \
          -e POSTGRES_DB=count_collab_test \
          postgres:16-alpine

        # Get the container's IP on the Docker bridge network (works in DinD)
        PG_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' e2e-postgres)
        echo "Postgres container IP: $PG_IP"
        echo "pg_url=postgresql://test:test@${PG_IP}:5432/count_collab_test" >> "$GITHUB_OUTPUT"

        echo "Waiting for Postgres to accept connections..."
        for i in $(seq 1 30); do
          if docker exec e2e-postgres pg_isready -U test -d count_collab_test >/dev/null 2>&1; then
            echo "Postgres is ready (attempt $i)"
            exit 0
          fi
          echo "Waiting for Postgres init... ($i/30)"
          sleep 2
        done
        echo "Postgres failed to start — container logs:"
        docker logs e2e-postgres
        exit 1
      shell: bash

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash

    - name: Build application
      run: bun run build
      shell: bash
      env:
        DATABASE_URL: ${{ steps.postgres.outputs.pg_url }}

    - name: Push database schema
      run: bunx drizzle-kit push:pg
      shell: bash
      env:
        DATABASE_URL: ${{ steps.postgres.outputs.pg_url }}

    - name: Install Playwright browsers
      run: bunx playwright install chromium --with-deps
      shell: bash

    - name: Run E2E tests
      run: bun run test:e2e
      shell: bash
      env:
        CI: "true"
        DATABASE_URL: ${{ steps.postgres.outputs.pg_url }}
        AUTH_SECRET: ci-test-secret

    - name: Stop Postgres
      if: always()
      run: docker rm -f e2e-postgres 2>/dev/null || true
      shell: bash
