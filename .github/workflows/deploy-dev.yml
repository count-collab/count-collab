name: DEV | Test, Build, and Deploy

on:
  push:
    branches: [develop]

jobs:
  test-and-build:
    name: Test & Build (DEV)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-and-build
        with:
          PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.PUBLIC_POSTHOG_PROJECT_TOKEN }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}

  docker-build:
    name: Docker Build (DEV)
    runs-on: self-hosted
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ghcr.io/count-collab/count-collab:develop
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (DEV)
    runs-on: self-hosted
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment:
      name: development
      url: ${{ vars.ENVIRONMENT_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          deploy-host: ${{ secrets.DEPLOY_HOST }}
          deploy-port: ${{ secrets.DEPLOY_PORT }}
          deploy-user: ${{ secrets.DEPLOY_USER }}
          deploy-ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ghcr-username: ${{ github.actor }}
          ghcr-pat: ${{ secrets.GITHUB_TOKEN }}
          docker-image: ghcr.io/count-collab/count-collab:develop
          deploy-dir: $HOME/count-collab-dev
          container-name: count-collab-dev
          app-port: "8000:3000"
          compose-filename: compose.yaml
          volume-name: postgres_data_dev
          postgres-user: ${{ secrets.POSTGRES_USER_DEV }}
          postgres-password: ${{ secrets.POSTGRES_PASSWORD_DEV }}
          postgres-db: ${{ secrets.POSTGRES_DB_DEV }}
          auth-secret: ${{ secrets.AUTH_SECRET_DEV }}
          auth-google-id: ${{ secrets.AUTH_GOOGLE_ID_DEV }}
          auth-google-secret: ${{ secrets.AUTH_GOOGLE_SECRET_DEV }}
          auth-discord-id: ${{ secrets.AUTH_DISCORD_ID_DEV }}
          auth-discord-secret: ${{ secrets.AUTH_DISCORD_SECRET_DEV }}
          auth-twitch-id: ${{ secrets.AUTH_TWITCH_ID_DEV }}
          auth-twitch-secret: ${{ secrets.AUTH_TWITCH_SECRET_DEV }}
          noindex: "true"
          posthog-key: ${{ vars.PUBLIC_POSTHOG_KEY }}
          posthog-host: ${{ vars.PUBLIC_POSTHOG_HOST }}
