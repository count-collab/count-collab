name: DEV | Reseed Database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reseed:
    name: Clear & Reseed Counters (DEV)
    runs-on: self-hosted

    steps:
      - name: Reseed via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            CONTAINER="count-collab-dev"

            if ! docker ps --format '{{.Names}}' | grep -q "^${CONTAINER}$"; then
              echo "ERROR: Container ${CONTAINER} is not running"
              exit 1
            fi

            echo "=== Deleting all counters and seed users ==="
            docker exec "$CONTAINER" bun run db:delete-counters

            echo ""
            echo "=== Seeding counters ==="
            docker exec "$CONTAINER" bun run db:init

            echo ""
            echo "Done — database has been reseeded."
