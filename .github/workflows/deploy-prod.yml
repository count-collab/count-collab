name: PROD | Test, Build, and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build (PROD)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/test-and-build
        with:
          PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.PUBLIC_POSTHOG_PROJECT_TOKEN }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}

  # e2e:
  #   runs-on: self-hosted
  #   needs: test-and-build

  #   steps:
  #     - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
  #     - uses: ./.github/actions/e2e

  #     - name: Upload Playwright report
  #       uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
  #       if: failure()
  #       with:
  #         name: playwright-report
  #         path: playwright-report/
  #         retention-days: 7

  docker-build:
    name: Docker Build (PROD)
    runs-on: self-hosted
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0

      - name: Build and push Docker image
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4.2.1
        with:
          push: true
          tags: ghcr.io/count-collab/count-collab:latest
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
            PUBLIC_POSTHOG_PROJECT_TOKEN=${{ vars.PUBLIC_POSTHOG_PROJECT_TOKEN }}
            PUBLIC_POSTHOG_HOST=${{ vars.PUBLIC_POSTHOG_HOST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (PROD)
    runs-on: self-hosted
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ vars.ENVIRONMENT_URL }}
    permissions:
      contents: read
      packages: read # GITHUB_TOKEN is used for docker login on the deploy host

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/deploy
        with:
          deploy-host: ${{ secrets.DEPLOY_HOST }}
          deploy-port: ${{ secrets.DEPLOY_PORT }}
          deploy-user: ${{ secrets.DEPLOY_USER }}
          deploy-ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ghcr-username: ${{ github.actor }}
          ghcr-pat: ${{ secrets.GITHUB_TOKEN }}
          docker-image: ghcr.io/count-collab/count-collab:latest
          deploy-dir: $HOME/count-collab
          container-name: count-collab
          app-port: "3000:3000"
          compose-filename: docker-compose.yml
          volume-name: postgres_data
          postgres-user: ${{ secrets.POSTGRES_USER }}
          postgres-password: ${{ secrets.POSTGRES_PASSWORD }}
          postgres-db: ${{ secrets.POSTGRES_DB }}
          auth-secret: ${{ secrets.AUTH_SECRET }}
          auth-google-id: ${{ secrets.AUTH_GOOGLE_ID }}
          auth-google-secret: ${{ secrets.AUTH_GOOGLE_SECRET }}
          auth-discord-id: ${{ secrets.AUTH_DISCORD_ID }}
          auth-discord-secret: ${{ secrets.AUTH_DISCORD_SECRET }}
          auth-twitch-id: ${{ secrets.AUTH_TWITCH_ID }}
          auth-twitch-secret: ${{ secrets.AUTH_TWITCH_SECRET }}
          domain: count-collab.cc
