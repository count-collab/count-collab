name: Sync main to develop

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: false # Disabled
    name: Merge main → develop
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into develop and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main

          # Exit early if develop already contains main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "develop is already up to date with main"
            exit 0
          fi

          BRANCH="auto/sync-main-to-develop"
          git checkout -B "$BRANCH" develop
          git merge origin/main --no-edit
          git push origin "$BRANCH" --force

          # Create PR if one doesn't already exist
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base develop --json number --jq '.[0].number')
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "chore: sync main into develop" \
              --body "Automated PR to cascade changes from \`main\` into \`develop\`."
          fi

          # Auto-merge the PR
          PR=$(gh pr list --head "$BRANCH" --base develop --json number --jq '.[0].number')
          gh pr merge "$PR" --merge --auto
