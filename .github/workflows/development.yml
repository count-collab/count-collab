name: Development

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/test-and-build
        with:
          PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.PUBLIC_POSTHOG_PROJECT_TOKEN }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}

  # Disable for now since e2e does not work, will be re-enabled in a future PR after fixing the underlying issues with the tests and/or CI environment
  # e2e:
  #   runs-on: self-hosted
  #   needs: test-and-build

  #   steps:
  #     - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
  #     - uses: ./.github/actions/e2e

  #     - name: Upload Playwright report
  #       uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
  #       if: failure()
  #       with:
  #         name: playwright-report
  #         path: playwright-report/
  #         retention-days: 7

  docker-build:
    runs-on: self-hosted
    needs: test-and-build

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0

      - name: Build Docker image
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4.2.1
        with:
          push: false
          tags: ghcr.io/count-collab/count-collab:latest
          build-args: |
            PUBLIC_POSTHOG_PROJECT_TOKEN=${{ vars.PUBLIC_POSTHOG_PROJECT_TOKEN }}
            PUBLIC_POSTHOG_HOST=${{ vars.PUBLIC_POSTHOG_HOST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
