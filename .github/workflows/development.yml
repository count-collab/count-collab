name: Test and Build on Pull Request

on:
  pull_request:

jobs:
  test-and-build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-and-build

  e2e:
    runs-on: self-hosted
    needs: test-and-build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: count_collab_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d count_collab_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5433/count_collab_test
      AUTH_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e
        with:
          database-url: ${{ env.DATABASE_URL }}
          auth-secret: ${{ env.AUTH_SECRET }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker-build:
    runs-on: self-hosted
    needs: e2e

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          push: false
          tags: ghcr.io/count-collab/count-collab:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
